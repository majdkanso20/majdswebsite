<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-content>
      @if (error(); as message) {
        <p class="login-form__error">{{ message | translate }}</p>
        <a mat-flat-button color="primary" routerLink="/login">{{ 'Back to sign in' | translate }}</a>
      } @else {
        <mat-spinner diameter="32" />
      }
    </mat-card-content>
  </mat-card>
</div>
