<h2 mat-dialog-title>{{ (isEdit ? 'Edit department' : 'New department') | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="department-form">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'Name' | translate }}</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'Description' | translate }}</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">{{ 'Cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="submit">{{ (isEdit ? 'Save' : 'Create') | translate }}</button>
  </mat-dialog-actions>
</form>
